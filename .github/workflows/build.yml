name: Build Addons

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Validate info.yaml
        run: npm run validate

      - name: Compile addons to versioned releases
        run: npm run build

      - name: Generate registry.json
        run: npm run registry

      - name: Commit compiled output
        if: github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "build: compile addon releases and update registry"
          file_pattern: "addons/*/releases/** addons/*/info.yaml registry.json"