name: Build Addons

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Validate info.yaml
        run: npm run validate

      - name: Compile addons to versioned releases
        run: npm run build

      - name: Prepare release content (generates registry.json)
        if: github.event_name == 'push'
        run: node scripts/prepare-release.mjs

      - name: Deploy to release branch (append-only, never remove old versions)
        if: github.event_name == 'push'
        run: |
          WORK=$(mktemp -d)
          cd "$WORK"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

          # Try to fetch existing release branch
          if git fetch origin release 2>/dev/null; then
            git checkout -b release FETCH_HEAD
          else
            git checkout --orphan release
            git rm -rf . 2>/dev/null || true
          fi

          # Remove stale non-release dirs/files
          # Keep only: <id>@v<version>/ dirs and registry.json
          for item in *; do
            case "$item" in
              registry.json) ;; # keep
              *@v*) ;;           # keep versioned addon dirs
              *) rm -rf "$item" ;; # remove everything else
            esac
          done

          # Copy new release files on top (additive, never removes old versioned dirs)
          cp -r "${{ github.workspace }}/release/"* . 2>/dev/null || true
          # Always overwrite registry.json
          cp "${{ github.workspace }}/release/registry.json" ./registry.json

          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "build: update release branch"
            git push origin HEAD:release --force
          else
            echo "No changes to commit"
          fi
