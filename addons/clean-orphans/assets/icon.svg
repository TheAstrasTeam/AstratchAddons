<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!-- Block stack (root block) -->
  <rect x="8" y="6" width="20" height="8" rx="3" fill="#4C97FF" stroke="#3373CC" stroke-width="1"/>
  <rect x="8" y="14" width="20" height="8" rx="0 0 3 3" fill="#4C97FF" stroke="#3373CC" stroke-width="1"/>
  <!-- Arrow pointing down to trash -->
  <path d="M28 18 L28 28" stroke="#9966FF" stroke-width="2" stroke-dasharray="3 2"/>
  <path d="M24 25 L28 29 L32 25" stroke="#9966FF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Orphan block (faded, being removed) -->
  <rect x="30" y="30" width="14" height="10" rx="3" fill="#CF63CF" fill-opacity="0.4" stroke="#9966FF" stroke-width="1" stroke-opacity="0.6" stroke-dasharray="2 2"/>
  <!-- X mark on orphan -->
  <line x1="34" y1="33" x2="40" y2="39" stroke="#FF6680" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="33" x2="34" y2="39" stroke="#FF6680" stroke-width="2" stroke-linecap="round"/>
</svg>
